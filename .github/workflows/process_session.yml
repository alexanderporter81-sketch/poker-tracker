name: Process PokerNow Session CSV

# Triggers whenever a CSV is added or updated in the sessions/ folder
on:
  push:
    paths:
      - 'sessions/*.csv'

permissions:
  contents: write   # needed to commit the updated sessions.json

jobs:
  process:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # Find all CSVs in sessions/ and rebuild sessions.json from scratch
      - name: Rebuild sessions.json from all CSVs
        run: python scripts/rebuild_sessions.py

      - name: Commit updated data
        run: |
          git config user.name  "Poker Tracker Bot"
          git config user.email "actions@github.com"
          git add data/sessions.json
          git diff --staged --quiet || git commit -m "Update tracker data [skip ci]"
          git push
